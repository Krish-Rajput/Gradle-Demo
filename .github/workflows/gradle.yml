name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # Set up Java Development Kit (change version if you are using a different one, e.g., 17 or 21)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Setup Gradle using the official GitHub action
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Grant execution permission for gradlew on Linux runner
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Run the build and test tasks
    - name: Build and Test with Gradle
      run: ./gradlew build